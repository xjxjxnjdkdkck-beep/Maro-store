<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>لوحة إدارة مارو</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; height: 100vh; overflow: hidden; }
    .side { width: 250px; background: #1e293b; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
    .nav-btn { background: transparent; border: none; color: #94a3b8; padding: 12px; text-align: right; font-size: 16px; border-radius: 10px; cursor: pointer; transition: 0.2s; }
    .nav-btn.active, .nav-btn:hover { background: #334155; color: white; }
    .main { flex: 1; padding: 30px; overflow-y: auto; }
    .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; text-align: right; margin-top: 15px; }
    th, td { padding: 12px; border-bottom: 1px solid #334155; }
    input, select { padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; width: 100%; margin-bottom: 10px; }
    .btn { background: #315de7; color: white; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: 700; }
    .btn-red { background: #ef4444; }
    .btn-green { background: #10b981; }
    .view { display: none; } .view.active { display: block; }
    .login-screen { position: fixed; inset: 0; background: #0f172a; display: grid; place-items: center; z-index: 999; }
  </style>
</head>
<body>
  <div class="login-screen" id="loginScreen">
    <div style="background:#1e293b;padding:40px;border-radius:16px;width:350px;">
      <h2 style="margin-bottom:20px;text-align:center;">تسجيل دخول الإدارة</h2>
      <input type="email" id="email" placeholder="البريد الإلكتروني">
      <input type="password" id="password" placeholder="كلمة المرور">
      <button class="btn" style="width:100%" onclick="login()">دخول</button>
    </div>
  </div>

  <div class="side" id="sidebar" style="display:none;">
    <h2 style="color:white;margin-bottom:20px;">مارو</h2>
    <button class="nav-btn active" onclick="showView('orders')">الطلبات</button>
    <button class="nav-btn" onclick="showView('products')">المنتجات</button>
    <button class="nav-btn" onclick="showView('coupons')">كوبونات الخصم</button>
    <button class="nav-btn" onclick="showView('complaints')">الشكاوى</button>
    <button class="nav-btn" onclick="showView('settings')">الإعدادات</button>
    <button class="nav-btn" style="margin-top:auto;color:#ef4444;" onclick="logout()">خروج</button>
  </div>

  <div class="main" id="mainContent" style="display:none;">
    <div class="view active" id="view-orders">
      <h1>الطلبات</h1>
      <div class="card"><table><thead><tr><th>الطلب</th><th>العميل</th><th>الإجمالي</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody id="ordersTable"></tbody></table></div>
    </div>
    <div class="view" id="view-coupons">
      <h1>كوبونات الخصم</h1>
      <div class="card">
        <input type="text" id="cpCode" placeholder="كود الخصم (مثال: MARO10)">
        <input type="number" id="cpDisc" placeholder="نسبة الخصم %">
        <button class="btn" onclick="addCoupon()">إضافة كوبون</button>
        <table><thead><tr><th>الكود</th><th>الخصم</th><th>حذف</th></tr></thead><tbody id="cpTable"></tbody></table>
      </div>
    </div>
    <div class="view" id="view-complaints">
      <h1>الشكاوى</h1>
      <div class="card"><table><thead><tr><th>الاسم</th><th>الهاتف</th><th>الرسالة</th><th>الحالة</th><th>حل</th></tr></thead><tbody id="compTable"></tbody></table></div>
    </div>
    <div class="view" id="view-settings">
      <h1>الإعدادات</h1>
      <div class="card">
        <label>رقم الواتساب</label>
        <input type="text" id="setWa" placeholder="9627...">
        <label>رقم المحفظة (زين كاش)</label>
        <input type="text" id="setWallet" placeholder="07...">
        <button class="btn" onclick="saveSettings()">حفظ الإعدادات</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    const firebaseConfig={apiKey:'AIzaSyAZucoNuZyKDoxfS7tboc3-ZttqONuw_vw',authDomain:'maro-store-4dc09.firebaseapp.com',projectId:'maro-store-4dc09',storageBucket:'maro-store-4dc09.firebasestorage.app',messagingSenderId:'55163169834',appId:'1:55163169834:web:48ba5eda57e23c41886753',measurementId:'G-FZWPNG5XD3'};
    const auth=getAuth(initializeApp(firebaseConfig));
    window.novaToken = '';

    onAuthStateChanged(auth, user => {
      if(user) {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('sidebar').style.display = 'flex';
        document.getElementById('mainContent').style.display = 'block';
        user.getIdToken().then(t => { window.novaToken = t; loadData(); });
      } else {
        document.getElementById('loginScreen').style.display = 'grid';
        document.getElementById('sidebar').style.display = 'none';
        document.getElementById('mainContent').style.display = 'none';
      }
    });

    window.login = () => signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value).catch(()=>alert('بيانات خاطئة'));
    window.logout = () => signOut(auth);

    window.showView = (id) => {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById('view-' + id).classList.add('active');
    };

    async function loadData() {
      const h = { headers: { Authorization: `Bearer ${window.novaToken}` } };
      // الطلبات
      const or = await (await fetch('/api/admin/orders', h)).json();
      document.getElementById('ordersTable').innerHTML = or.map(o => `<tr><td>${o.id}</td><td>${o.customer_name}</td><td>$${o.total}</td><td>${o.status}</td><td><button class="btn btn-red" onclick="delOrder('${o.id}')">حذف</button></td></tr>`).join('');
      // الكوبونات
      const cp = await (await fetch('/api/admin/coupons', h)).json();
      document.getElementById('cpTable').innerHTML = cp.map(c => `<tr><td>${c.code}</td><td>${c.discount}%</td><td><button class="btn btn-red" onclick="delCoupon('${c.code}')">حذف</button></td></tr>`).join('');
      // الشكاوى
      const co = await (await fetch('/api/admin/complaints', h)).json();
      document.getElementById('compTable').innerHTML = co.map(c => `<tr><td>${c.name}</td><td>${c.phone}</td><td>${c.message}</td><td>${c.status}</td><td><button class="btn btn-green" onclick="resolveComp(${c.id})">حل</button></td></tr>`).join('');
      // الإعدادات
      const se = await (await fetch('/api/admin/settings', h)).json();
      se.forEach(s => { if(s.setting_key==='whatsapp') document.getElementById('setWa').value = s.setting_value; if(s.setting_key==='wallet') document.getElementById('setWallet').value = s.setting_value; });
    }

    window.delOrder = async (id) => { if(confirm('حذف الطلب؟')) { await fetch('/api/admin/orders/'+id, {method:'DELETE', headers:{Authorization:`Bearer ${window.novaToken}`}}); loadData(); } };
    window.delCoupon = async (code) => { await fetch('/api/admin/coupons/'+code, {method:'DELETE', headers:{Authorization:`Bearer ${window.novaToken}`}}); loadData(); };
    window.resolveComp = async (id) => { await fetch('/api/admin/complaints/'+id, {method:'PATCH', headers:{Authorization:`Bearer ${window.novaToken}`,'Content-Type':'application/json'}, body:JSON.stringify({status:'resolved'})}); loadData(); };
    
    window.addCoupon = async () => {
      await fetch('/api/admin/coupons', {method:'POST', headers:{Authorization:`Bearer ${window.novaToken}`,'Content-Type':'application/json'}, body:JSON.stringify({code: document.getElementById('cpCode').value, discount: document.getElementById('cpDisc').value})});
      loadData();
    };
    window.saveSettings = async () => {
      await fetch('/api/admin/settings', {method:'POST', headers:{Authorization:`Bearer ${window.novaToken}`,'Content-Type':'application/json'}, body:JSON.stringify({key:'whatsapp', value:document.getElementById('setWa').value})});
      await fetch('/api/admin/settings', {method:'POST', headers:{Authorization:`Bearer ${window.novaToken}`,'Content-Type':'application/json'}, body:JSON.stringify({key:'wallet', value:document.getElementById('setWallet').value})});
      alert('تم الحفظ');
    };
  </script>
</body>
</html>
