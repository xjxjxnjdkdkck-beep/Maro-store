<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>لوحة إدارة مارو</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
    
    :root {
      --bg: #0f172a; --surface: #1e293b; --surface-hover: #334155;
      --text: #f8fafc; --text-muted: #94a3b8;
      --primary: #0b5fff; --primary-glow: rgba(11,95,255,0.3);
      --accent: #ff6b00; --success: #10b981; --danger: #ef4444;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; }

    /* Sidebar */
    .sidebar { width: 260px; background: var(--surface); border-left: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px; }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 40px; }
    .brand-logo { width: 40px; height: 40px; background: linear-gradient(135deg, var(--primary), #0044cc); border-radius: 10px; display: grid; place-items: center; font-size: 20px; font-weight: 900; box-shadow: 0 5px 15px var(--primary-glow); }
    .brand h2 { font-size: 20px; font-weight: 900; }
    
    .nav-btn { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 15px; background: transparent; border: none; color: var(--text-muted); font-family: 'Cairo'; font-size: 15px; font-weight: 700; border-radius: 10px; cursor: pointer; transition: 0.2s; text-align: right; }
    .nav-btn:hover { background: var(--surface-hover); color: var(--text); }
    .nav-btn.active { background: var(--primary); color: white; box-shadow: 0 4px 12px var(--primary-glow); }
    
    .logout-btn { margin-top: auto; color: var(--danger); background: rgba(239, 68, 68, 0.1); }
    .logout-btn:hover { background: var(--danger); color: white; }

    /* Main Content */
    .main { flex: 1; padding: 30px; overflow-y: auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .header h1 { font-size: 28px; font-weight: 900; }
    
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
    .stat-card { background: var(--surface); padding: 20px; border-radius: 16px; border: 1px solid var(--border); position: relative; overflow: hidden; }
    .stat-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--primary); }
    .stat-card.green::before { background: var(--success); }
    .stat-card.orange::before { background: var(--accent); }
    .stat-card h3 { color: var(--text-muted); font-size: 14px; font-weight: 600; margin-bottom: 10px; }
    .stat-card p { font-size: 32px; font-weight: 900; }

    /* Cards & Tables */
    .card { background: var(--surface); border-radius: 16px; border: 1px solid var(--border); overflow: hidden; margin-bottom: 20px; }
    .card-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .card-header h2 { font-size: 18px; font-weight: 800; }
    
    table { width: 100%; border-collapse: collapse; text-align: right; }
    th { background: #0f172a; color: var(--text-muted); padding: 15px 20px; font-size: 13px; font-weight: 700; }
    td { padding: 15px 20px; border-bottom: 1px solid var(--border); font-size: 14px; }
    tr:hover td { background: rgba(255,255,255,0.02); }
    
    .badge { padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; }
    .badge.pending { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
    .badge.completed { background: rgba(16, 185, 129, 0.2); color: var(--success); }
    .badge.cancelled { background: rgba(239, 68, 68, 0.2); color: var(--danger); }

    .btn { padding: 10px 20px; border-radius: 8px; font-family: 'Cairo'; font-weight: 700; cursor: pointer; border: none; transition: 0.2s; }
    .btn-primary { background: var(--primary); color: white; box-shadow: 0 4px 12px var(--primary-glow); }
    .btn-primary:hover { background: #0044cc; }
    .btn-danger { background: rgba(239, 68, 68, 0.1); color: var(--danger); }
    .btn-danger:hover { background: var(--danger); color: white; }

    /* Login Screen */
    .login-screen { position: fixed; inset: 0; background: var(--bg); display: grid; place-items: center; z-index: 1000; }
    .login-box { background: var(--surface); padding: 40px; border-radius: 24px; width: 100%; max-width: 400px; border: 1px solid var(--border); box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); text-align: center; }
    .login-box h2 { margin-bottom: 30px; font-weight: 900; }
    .form-group { margin-bottom: 20px; text-align: right; }
    .form-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
    .form-control { width: 100%; padding: 12px 15px; border-radius: 10px; background: var(--bg); border: 1px solid var(--border); color: white; font-family: 'Cairo'; outline: none; transition: 0.2s; }
    .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }

    @media (max-width: 900px) {
      .sidebar { display: none; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .main { padding: 15px; }
    }
  </style>
</head>
<body>

  <!-- Login -->
  <div class="login-screen" id="loginScreen">
    <div class="login-box">
      <div style="width:60px; height:60px; background:linear-gradient(135deg, var(--primary), #0044cc); border-radius:16px; display:grid; place-items:center; font-size:30px; font-weight:900; margin:0 auto 20px; box-shadow:0 10px 20px var(--primary-glow);">M</div>
      <h2>مرحباً بعودتك</h2>
      <form id="loginForm">
        <div class="form-group"><label>البريد الإلكتروني</label><input type="email" id="email" class="form-control" required></div>
        <div class="form-group"><label>كلمة المرور</label><input type="password" id="password" class="form-control" required></div>
        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:10px;">تسجيل الدخول</button>
        <p id="errorMsg" style="color:var(--danger); font-size:13px; margin-top:15px; display:none;"></p>
      </form>
    </div>
  </div>

  <!-- Dashboard -->
  <div style="display:none; width:100%; height:100%;" id="dashboard">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">M</div>
        <h2>لوحة مارو</h2>
      </div>
      <button class="nav-btn active">📊 نظرة عامة</button>
      <button class="nav-btn">🛍️ الطلبات</button>
      <button class="nav-btn">📦 المنتجات</button>
      <button class="nav-btn">⚙️ الإعدادات</button>
      <button class="nav-btn logout-btn" id="logoutBtn">🚪 تسجيل الخروج</button>
    </aside>

    <main class="main">
      <div class="header">
        <h1>نظرة عامة</h1>
        <a href="index.html" class="btn btn-primary" style="text-decoration:none;">فتح المتجر ↗</a>
      </div>

      <div class="stats-grid">
        <div class="stat-card green">
          <h3>إجمالي المبيعات</h3>
          <p id="statSales">$0.00</p>
        </div>
        <div class="stat-card orange">
          <h3>الطلبات الجديدة</h3>
          <p id="statOrders">0</p>
        </div>
        <div class="stat-card">
          <h3>المنتجات</h3>
          <p id="statProducts">0</p>
        </div>
        <div class="stat-card">
          <h3>الأكواد المتاحة</h3>
          <p id="statCodes">0</p>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h2>أحدث الطلبات</h2>
        </div>
        <table>
          <thead>
            <tr>
              <th>رقم الطلب</th>
              <th>العميل</th>
              <th>الإجمالي</th>
              <th>الحالة</th>
              <th>إجراء</th>
            </tr>
          </thead>
          <tbody id="ordersTable">
            <tr><td colspan="5" style="text-align:center; padding:30px; color:var(--text-muted);">جارٍ تحميل البيانات...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    
    const firebaseConfig={apiKey:'AIzaSyAZucoNuZyKDoxfS7tboc3-ZttqONuw_vw',authDomain:'maro-store-4dc09.firebaseapp.com',projectId:'maro-store-4dc09',storageBucket:'maro-store-4dc09.firebasestorage.app',messagingSenderId:'55163169834',appId:'1:55163169834:web:48ba5eda57e23c41886753',measurementId:'G-FZWPNG5XD3'};
    const auth = getAuth(initializeApp(firebaseConfig));

    onAuthStateChanged(auth, async user => {
      if (user) {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'flex';
        loadDashboardData(user);
      } else {
        document.getElementById('loginScreen').style.display = 'grid';
        document.getElementById('dashboard').style.display = 'none';
      }
    });

    document.getElementById('loginForm').onsubmit = async (e) => {
      e.preventDefault();
      try {
        await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value);
      } catch (err) {
        const errDiv = document.getElementById('errorMsg');
        errDiv.textContent = 'بيانات الدخول غير صحيحة أو الحساب غير مصرح له.';
        errDiv.style.display = 'block';
      }
    };

    document.getElementById('logoutBtn').onclick = () => signOut(auth);

    async function loadDashboardData(user) {
      const token = await user.getIdToken();
      try {
        const [pr, or] = await Promise.all([
          fetch('/api/admin/products', { headers: { Authorization: `Bearer ${token}` } }),
          fetch('/api/admin/orders', { headers: { Authorization: `Bearer ${token}` } })
        ]);
        
        const products = await pr.json();
        const orders = await or.json();

        if (!pr.ok || !or.ok) throw new Error('Unauthorized');

        const totalSales = orders.reduce((a, o) => a + Number(o.total || 0), 0);
        const pendingOrders = orders.filter(o => o.status === 'pending').length;
        const totalCodes = products.reduce((a, p) => a + Number(p.available_codes || 0), 0);

        document.getElementById('statSales').textContent = '$' + totalSales.toFixed(2);
        document.getElementById('statOrders').textContent = pendingOrders;
        document.getElementById('statProducts').textContent = products.length;
        document.getElementById('statCodes').textContent = totalCodes;

        document.getElementById('ordersTable').innerHTML = orders.slice(0, 10).map(o => `
          <tr>
            <td><b>${o.id}</b></td>
            <td>${o.customer_name || o.customer} <br><small style="color:var(--text-muted)">${o.phone}</small></td>
            <td style="color:var(--success); font-weight:900;">$${Number(o.total).toFixed(2)}</td>
            <td><span class="badge ${o.status}">${o.status === 'pending' ? 'جديد' : o.status}</span></td>
            <td><button class="btn btn-primary" style="padding:5px 10px; font-size:12px;" onclick="alert('رقم الطلب: ${o.id}')">تفاصيل</button></td>
          </tr>
        `).join('') || '<tr><td colspan="5" style="text-align:center; padding:30px; color:var(--text-muted);">لا توجد طلبات.</td></tr>';

      } catch (err) {
        console.error(err);
        alert('تعذر جلب البيانات. تأكد من أنك المدير.');
      }
    }
  </script>
</body>
</html>
